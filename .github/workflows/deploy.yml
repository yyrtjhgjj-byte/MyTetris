name: Deploy Tetris Web App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GitHub Pages の「Source: GitHub Actions」用の設定です
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/configure-pages@v5
    # web/ は HTML/CSS/JS だけで動くので、ビルドせずそのまま公開します
    - uses: actions/upload-pages-artifact@v3
      with:
        path: ./web
    - id: deployment
      uses: actions/deploy-pages@v4
